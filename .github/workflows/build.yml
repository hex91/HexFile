name: Build APK

# 触发：推送到 main、打 v* 标签、手动触发
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 发布 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Warn if version already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -o 'android:versionName="[^"]*"' AndroidManifest.xml | head -1 | sed 's/.*"\(.*\)"/\1/')
          PREV=$(gh release view continuous --json assets --jq '.assets[].name' 2>/dev/null \
                 | sed -n 's/^HexFile-\(.*\)\.apk$/\1/p' | head -1 || true)
          echo "本次版本：$VER / 上次发布：${PREV:-（无）}"
          if [ -n "$PREV" ] && [ "$PREV" = "$VER" ]; then
            echo "::warning title=版本号未升级::上次已发布 $PREV，本次推送仍是 $VER。若是功能改动，请升 AndroidManifest.xml 的 versionCode/versionName，否则同名 APK 会被覆盖。"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK (cmdline-tools / build-tools / platform / ndk)
        run: |
          set -euo pipefail
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"
          URL=https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          # dl.google.com 走 HTTP/2 偶发 INTERNAL_ERROR（v1.71.0 构建失败原因），
          # 强制 HTTP/1.1 + 多次重试 + 校验压缩包完整性
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL --http1.1 --connect-timeout 20 --max-time 600 \
                 --retry 5 --retry-delay 3 --retry-all-errors \
                 -o /tmp/cmdtools.zip "$URL" && unzip -tq /tmp/cmdtools.zip >/dev/null 2>&1; then
              ok=1; break
            fi
            echo "::warning::cmdline-tools 下载失败（第 $i 次），3 秒后重试"
            rm -f /tmp/cmdtools.zip
            sleep 3
          done
          [ "$ok" = "1" ] || { echo "::error::cmdline-tools 连续下载失败，放弃构建"; exit 1; }
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          # sdkmanager 读够输入就退出，yes 收到 SIGPIPE 返回 141；
          # pipefail + set -e 会把它当失败，必须显式吞掉
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          for i in 1 2 3; do
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
              "platform-tools" "build-tools;37.0.0" "platforms;android-35" "ndk;27.0.12077973" && break
            echo "::warning::sdkmanager 安装失败（第 $i 次），5 秒后重试"
            sleep 5
            if [ "$i" = "3" ]; then echo "::error::SDK 组件安装失败"; exit 1; fi
          done
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          PYTHON_EXE: python3
          HEXFILE_KEYSTORE_BASE64: ${{ secrets.HEXFILE_KEYSTORE_BASE64 }}
          HEXFILE_KEYSTORE_PASS: ${{ secrets.HEXFILE_KEYSTORE_PASS }}
        run: bash build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HexFile-APK
          path: out/HexFile-[0-9]*.apk

      - name: Read version name
        id: ver
        run: |
          V=$(grep -o 'android:versionName="[^"]*"' AndroidManifest.xml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "APK 版本：$V"

      - name: Release (tagged version)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/HexFile-[0-9]*.apk
          generate_release_notes: true

      - name: Prune older APKs from continuous release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # continuous 是固定 tag，每版都会往同一个 release 里新增 asset，
          # 旧包不清理就会一直堆（1.71.0、1.72.0…）。发布前先清空，下一步只留本次产物。
          OLD=$(gh release view continuous --json assets --jq '.assets[].name' 2>/dev/null \
                | grep -E '^HexFile-.*\.apk$' || true)
          if [ -z "$OLD" ]; then
            echo "无历史 APK 需要清理"
            exit 0
          fi
          echo "$OLD" | while read -r name; do
            [ -z "$name" ] && continue
            echo "删除旧资产：$name"
            gh release delete-asset continuous "$name" --yes || true
          done

      - name: Continuous release (latest from main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous Build v${{ steps.ver.outputs.name }} (latest from main)
          prerelease: true
          files: out/HexFile-[0-9]*.apk
